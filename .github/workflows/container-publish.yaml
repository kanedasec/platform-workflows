name: Reusable container publish

on:
  workflow_call:
    inputs:
      images:
        description: JSON array of image names, build contexts, and Dockerfiles
        required: true
        type: string

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  validate:
    name: Container configuration
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      matrix: ${{ steps.configuration.outputs.matrix }}

    steps:
      - name: Check out caller repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Validate publishing context and image definitions
        id: configuration
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          IMAGES_JSON: ${{ inputs.images }}
        run: |
          python3 - <<'PY'
          import json
          import os
          import re
          from pathlib import Path

          default_ref = f"refs/heads/{os.environ['DEFAULT_BRANCH']}"
          if os.environ["GITHUB_REF"] != default_ref:
              raise SystemExit(
                  f"container publishing is restricted to {default_ref}"
              )

          try:
              images = json.loads(os.environ["IMAGES_JSON"])
          except json.JSONDecodeError as error:
              raise SystemExit(f"images must be valid JSON: {error}") from error

          if not isinstance(images, list) or not 1 <= len(images) <= 10:
              raise SystemExit("images must contain between 1 and 10 definitions")

          repository = Path.cwd().resolve()
          allowed_keys = {"name", "context", "dockerfile"}
          names = set()

          for index, image in enumerate(images):
              if not isinstance(image, dict) or set(image) != allowed_keys:
                  raise SystemExit(
                      f"image {index} must contain exactly: "
                      + ", ".join(sorted(allowed_keys))
                  )

              if not all(isinstance(image[key], str) for key in allowed_keys):
                  raise SystemExit(f"image {index} values must be strings")

              name = image["name"]
              if not re.fullmatch(r"[a-z0-9][a-z0-9._-]{0,63}", name):
                  raise SystemExit(f"invalid image component name: {name!r}")
              if name in names:
                  raise SystemExit(f"duplicate image component name: {name}")
              names.add(name)

              context = (repository / image["context"]).resolve()
              dockerfile = (repository / image["dockerfile"]).resolve()
              if not context.is_relative_to(repository) or not context.is_dir():
                  raise SystemExit(
                      f"image {name} context must be a repository directory"
                  )
              if not dockerfile.is_relative_to(repository) or not dockerfile.is_file():
                  raise SystemExit(
                      f"image {name} Dockerfile must be a repository file"
                  )

          matrix = json.dumps({"include": images}, separators=(",", ":"))
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as output:
              output.write(f"matrix={matrix}\n")
          PY

  publish:
    name: Publish ${{ matrix.name }}
    needs: validate
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix: ${{ fromJSON(needs.validate.outputs.matrix) }}

    steps:
      - name: Check out caller repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0

      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Generate image metadata
        id: metadata
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ghcr.io/${{ github.repository_owner }}/${{ github.event.repository.name }}-${{ matrix.name }}
          tags: |
            type=raw,value=sha-${{ github.sha }}
            type=raw,value=dev
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=sha-${{ github.sha }}

      - name: Build and publish image
        id: build
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          platforms: linux/amd64
          pull: true
          push: true
          tags: ${{ steps.metadata.outputs.tags }}
          labels: ${{ steps.metadata.outputs.labels }}
          provenance: mode=min
          sbom: false

      - name: Record published artifact
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
          IMAGE: ghcr.io/${{ github.repository_owner }}/${{ github.event.repository.name }}-${{ matrix.name }}
          TAG: sha-${{ github.sha }}
        run: |
          {
            echo "### Published container"
            echo
            echo "\`$IMAGE:$TAG\`"
            echo
            echo "Digest: \`$DIGEST\`"
          } >> "$GITHUB_STEP_SUMMARY"
