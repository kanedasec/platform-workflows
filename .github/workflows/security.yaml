name: Reusable full-repository security scanners

on:
  workflow_call:
    inputs:
      gates:
        description: Validated non-empty JSON array of selected gate slugs
        required: true
        type: string

permissions:
  actions: read
  contents: read

defaults:
  run:
    shell: bash

jobs:
  sast:
    name: SAST (Semgrep)
    if: contains(fromJSON(inputs.gates), 'sast')
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    env:
      SEMGREP_SEND_METRICS: "off"

    steps:
      - name: Check out pull request snapshot
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 1
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha }}

      - name: Set up Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: "3.12"

      - name: Install Semgrep
        run: python -m pip install --disable-pip-version-check semgrep==1.175.0

      - name: Scan complete repository snapshot
        run: |
          report_dir="$RUNNER_TEMP/security-reports"
          mkdir -p "$report_dir"
          semgrep scan \
            --config p/default \
            --disable-nosem \
            --metrics=off \
            --json \
            --output "$report_dir/semgrep.json" \
            .

      - name: Upload Semgrep report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: semgrep-report
          path: ${{ runner.temp }}/security-reports/semgrep.json
          if-no-files-found: warn
          retention-days: 7

  secrets:
    name: Secrets (Gitleaks)
    if: contains(fromJSON(inputs.gates), 'secrets')
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    steps:
      - name: Check out pull request snapshot
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 1
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha }}

      - name: Scan complete repository snapshot
        uses: kanedasec/platform-workflows/actions/gitleaks-scan@c71ac2d3ec44dc237824161b8f0ebdd666c495fb
        with:
          report_path: ${{ runner.temp }}/security-reports/gitleaks.json

      - name: Upload redacted Gitleaks report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: gitleaks-report
          path: ${{ runner.temp }}/security-reports/gitleaks.json
          if-no-files-found: warn
          retention-days: 7

  sca:
    name: SCA (Trivy)
    if: contains(fromJSON(inputs.gates), 'sca')
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    env:
      TRIVY_VERSION: 0.74.0
      TRIVY_SHA256: 2ae6fe3ee734b7fdf11335663e18c75ea12dccc76062f09f164a3b0f8be4371a

    steps:
      - name: Check out pull request snapshot
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 1
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha }}

      - name: Install Trivy
        run: |
          archive="$RUNNER_TEMP/trivy.tar.gz"
          bin_dir="$RUNNER_TEMP/bin"
          mkdir -p "$bin_dir"
          curl --fail --location --silent --show-error \
            "https://github.com/aquasecurity/trivy/releases/download/v${TRIVY_VERSION}/trivy_${TRIVY_VERSION}_Linux-64bit.tar.gz" \
            --output "$archive"
          echo "${TRIVY_SHA256}  ${archive}" | sha256sum --check --strict
          tar -xzf "$archive" -C "$bin_dir" trivy
          chmod 0755 "$bin_dir/trivy"
          echo "$bin_dir" >> "$GITHUB_PATH"

      - name: Scan complete dependency snapshot
        run: |
          report_dir="$RUNNER_TEMP/security-reports"
          ignore_file="$RUNNER_TEMP/trivy.ignore"
          mkdir -p "$report_dir"
          install -m 0444 /dev/null "$ignore_file"
          trivy fs \
            --scanners vuln \
            --ignorefile "$ignore_file" \
            --format json \
            --output "$report_dir/trivy.json" \
            --no-progress \
            .

      - name: Upload Trivy report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: trivy-report
          path: ${{ runner.temp }}/security-reports/trivy.json
          if-no-files-found: warn
          retention-days: 7
