name: Reusable differential security

on:
  workflow_call:

permissions:
  actions: read
  contents: read

defaults:
  run:
    shell: bash

jobs:
  sast:
    name: SAST (Semgrep)
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    env:
      BASE_SHA: ${{ github.event.pull_request.base.sha }}
      SEMGREP_SEND_METRICS: "off"

    steps:
      - name: Check out pull request
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha }}

      - name: Set up Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: "3.12"

      - name: Install Semgrep
        run: python -m pip install --disable-pip-version-check semgrep==1.175.0

      - name: Scan changed code
        run: |
          report_dir="$RUNNER_TEMP/security-reports"
          mkdir -p "$report_dir"
          semgrep scan \
            --config p/default \
            --baseline-commit "$BASE_SHA" \
            --disable-nosem \
            --metrics=off \
            --json \
            --output "$report_dir/semgrep.json" \
            .

      - name: Upload Semgrep report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: semgrep-report
          path: ${{ runner.temp }}/security-reports/semgrep.json
          if-no-files-found: warn
          retention-days: 7

  secrets:
    name: Secrets (Gitleaks)
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    steps:
      - name: Check out pull request
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha }}

      - name: Scan pull request commits
        uses: kanedasec/platform-workflows/actions/gitleaks-scan@bc708f7a99aa11f1e64fb38edab9a43db68d742b
        with:
          base_sha: ${{ github.event.pull_request.base.sha }}
          head_sha: ${{ github.event.pull_request.head.sha }}
          report_path: ${{ runner.temp }}/security-reports/gitleaks.json

      - name: Upload redacted Gitleaks report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: gitleaks-report
          path: ${{ runner.temp }}/security-reports/gitleaks.json
          if-no-files-found: warn
          retention-days: 7

  sca:
    name: SCA (Trivy)
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    env:
      BASE_SHA: ${{ github.event.pull_request.base.sha }}
      TRIVY_VERSION: 0.74.0
      TRIVY_SHA256: 2ae6fe3ee734b7fdf11335663e18c75ea12dccc76062f09f164a3b0f8be4371a

    steps:
      - name: Check out pull request
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha }}

      - name: Set up Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: "3.12"

      - name: Install Trivy
        run: |
          archive="$RUNNER_TEMP/trivy.tar.gz"
          bin_dir="$RUNNER_TEMP/bin"
          mkdir -p "$bin_dir"
          curl --fail --location --silent --show-error \
            "https://github.com/aquasecurity/trivy/releases/download/v${TRIVY_VERSION}/trivy_${TRIVY_VERSION}_Linux-64bit.tar.gz" \
            --output "$archive"
          echo "${TRIVY_SHA256}  ${archive}" | sha256sum --check --strict
          tar -xzf "$archive" -C "$bin_dir" trivy
          chmod 0755 "$bin_dir/trivy"
          echo "$bin_dir" >> "$GITHUB_PATH"

      - name: Scan base and pull request dependencies
        run: |
          base_dir="$RUNNER_TEMP/trivy-base"
          report_dir="$RUNNER_TEMP/security-reports"
          ignore_file="$RUNNER_TEMP/trivy.ignore"
          mkdir -p "$report_dir"
          install -m 0444 /dev/null "$ignore_file"
          git worktree add --detach "$base_dir" "$BASE_SHA"

          (
            cd "$base_dir"
            trivy fs \
              --scanners vuln \
              --ignorefile "$ignore_file" \
              --format json \
              --output "$report_dir/trivy-base.json" \
              --no-progress \
              .
          )

          trivy fs \
            --scanners vuln \
            --ignorefile "$ignore_file" \
            --format json \
            --output "$report_dir/trivy-head.json" \
            --no-progress \
            --skip-db-update \
            .

      - name: Create differential Trivy report
        uses: kanedasec/platform-workflows/actions/trivy-diff@bc708f7a99aa11f1e64fb38edab9a43db68d742b
        with:
          base_report: ${{ runner.temp }}/security-reports/trivy-base.json
          head_report: ${{ runner.temp }}/security-reports/trivy-head.json
          output_report: ${{ runner.temp }}/security-reports/trivy-delta.json

      - name: Upload Trivy differential report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: trivy-report
          path: ${{ runner.temp }}/security-reports/trivy-delta.json
          if-no-files-found: warn
          retention-days: 7

  policy-gate:
    name: Security policy (SGP Manager)
    needs:
      - sast
      - secrets
      - sca
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment:
      name: security-policy

    permissions:
      actions: read
      contents: read

    steps:
      - name: Download Semgrep report
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: semgrep-report
          path: ${{ runner.temp }}/security-reports

      - name: Download Gitleaks report
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: gitleaks-report
          path: ${{ runner.temp }}/security-reports

      - name: Download Trivy report
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: trivy-report
          path: ${{ runner.temp }}/security-reports

      - name: Apply SGP Manager gate policies
        uses: kanedasec/platform-workflows/actions/sgp-policy-gate@bc708f7a99aa11f1e64fb38edab9a43db68d742b
        env:
          SGP_MANAGER_API_KEY: ${{ secrets.SGP_MANAGER_API_KEY }}
        with:
          manager_url: https://sgp.kanedasec.com.br
          application: ${{ github.event.repository.name }}
          semgrep_report: ${{ runner.temp }}/security-reports/semgrep.json
          gitleaks_report: ${{ runner.temp }}/security-reports/gitleaks.json
          trivy_report: ${{ runner.temp }}/security-reports/trivy-delta.json
          decision_directory: ${{ runner.temp }}/policy-decisions

      - name: Upload SGP Manager decisions
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: sgp-policy-decisions
          path: ${{ runner.temp }}/policy-decisions/*.json
          if-no-files-found: warn
          retention-days: 7
