name: Differential Trivy report
description: Emit vulnerabilities present in a head Trivy JSON report but absent from its base report.

inputs:
  base_report:
    description: Absolute path to the base Trivy JSON report
    required: true
  head_report:
    description: Absolute path to the head Trivy JSON report
    required: true
  output_report:
    description: Absolute path for the differential Trivy JSON report
    required: true
  fail_on:
    description: Optional comma-separated severities that make the action fail
    required: false
    default: ""

runs:
  using: composite
  steps:
    - name: Create differential report
      shell: bash
      env:
        BASE_REPORT: ${{ inputs.base_report }}
        HEAD_REPORT: ${{ inputs.head_report }}
        OUTPUT_REPORT: ${{ inputs.output_report }}
        FAIL_ON: ${{ inputs.fail_on }}
      run: |
        python3 "$GITHUB_ACTION_PATH/trivy_diff.py" \
          --base "$BASE_REPORT" \
          --head "$HEAD_REPORT" \
          --output "$OUTPUT_REPORT" \
          --fail-on "$FAIL_ON"
