title = "Kanedasec platform Gitleaks configuration"
minVersion = "v8.30.0"

[extend]
useDefault = true

[[allowlists]]
description = "GitHub workflow, action metadata, and platform documentation uses lines pinned to immutable commit SHAs"
targetRules = ["sourcegraph-access-token"]
condition = "AND"
regexTarget = "line"
paths = ['''^(?:\.github/workflows/[^/]+\.ya?ml|(?:.+/)?action\.ya?ml|docs/[^/]+\.md)$''']
regexes = ['''^\s*uses:\s+[A-Za-z0-9_.-]+/[A-Za-z0-9_.-]+(?:/[A-Za-z0-9_.-]+)*@[0-9a-f]{40}(\s+#[^\r\n]*)?$''']
