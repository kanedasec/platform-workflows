name: Full-repository Gitleaks scan
description: Scan the complete current repository snapshot and produce a fully redacted JSON report.

inputs:
  report_path:
    description: Absolute path for the Gitleaks JSON report
    required: true

runs:
  using: composite
  steps:
    - name: Install Gitleaks
      shell: bash
      env:
        GITLEAKS_VERSION: "8.30.0"
        GITLEAKS_SHA256: 79a3ab579b53f71efd634f3aaf7e04a0fa0cf206b7ed434638d1547a2470a66e
      run: |
        archive="$RUNNER_TEMP/gitleaks.tar.gz"
        bin_dir="$RUNNER_TEMP/platform-bin"
        mkdir -p "$bin_dir"
        curl --fail --location --silent --show-error \
          "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" \
          --output "$archive"
        echo "${GITLEAKS_SHA256}  ${archive}" | sha256sum --check --strict
        tar -xzf "$archive" -C "$bin_dir" gitleaks
        chmod 0755 "$bin_dir/gitleaks"
        echo "$bin_dir" >> "$GITHUB_PATH"

    - name: Scan complete repository snapshot
      shell: bash
      env:
        REPORT_PATH: ${{ inputs.report_path }}
      run: |
        report_parent="${REPORT_PATH%/*}"
        mkdir -p "$report_parent"
        gitleaks dir \
          --config "$GITHUB_ACTION_PATH/gitleaks.toml" \
          --gitleaks-ignore-path "$GITHUB_ACTION_PATH/gitleaks.ignore" \
          --ignore-gitleaks-allow \
          --report-format json \
          --report-path "$REPORT_PATH" \
          --redact=100 \
          --exit-code=0 \
          --no-banner \
          .
