name: SGP Manager policy from scanner artifacts
description: Download scanner reports and apply online bypasses or strict offline no-bypass policy.

inputs:
  gates:
    description: Validated JSON execution order containing every registered gate
    required: true

runs:
  using: composite
  steps:
    - name: Download Semgrep report
      if: contains(fromJSON(inputs.gates), 'sast')
      uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
      with:
        name: semgrep-report
        path: ${{ runner.temp }}/security-reports

    - name: Download Gitleaks report
      if: contains(fromJSON(inputs.gates), 'secrets')
      uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
      with:
        name: gitleaks-report
        path: ${{ runner.temp }}/security-reports

    - name: Download Trivy report
      if: contains(fromJSON(inputs.gates), 'sca')
      uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
      with:
        name: trivy-report
        path: ${{ runner.temp }}/security-reports

    - name: Apply online bypasses or strict offline policy
      shell: bash
      env:
        SGP_MANAGER_API_KEY: ${{ env.SGP_MANAGER_API_KEY }}
        SGP_MANAGER_URL: https://sgp.kanedasec.com.br
        SGP_APPLICATION: ${{ github.event.repository.name }}
        SEMGREP_REPORT: ${{ runner.temp }}/security-reports/semgrep.json
        GITLEAKS_REPORT: ${{ runner.temp }}/security-reports/gitleaks.json
        TRIVY_REPORT: ${{ runner.temp }}/security-reports/trivy.json
        DECISION_DIRECTORY: ${{ runner.temp }}/policy-decisions
        ENABLED_GATES: ${{ inputs.gates }}
      run: "$GITHUB_ACTION_PATH/../sgp-policy-gate/run_policy_gates.sh"

    - name: Upload SGP Manager decisions
      if: always()
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
      with:
        name: sgp-policy-decisions
        path: ${{ runner.temp }}/policy-decisions/*.json
        if-no-files-found: warn
        retention-days: 7
