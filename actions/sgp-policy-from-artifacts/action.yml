name: SGP Manager policy from scanner artifacts
description: Download standardized scanner reports and apply SGP Manager policies.

inputs:
  gates:
    description: Validated non-empty JSON array of selected gate slugs
    required: true

runs:
  using: composite
  steps:
    - name: Download Semgrep report
      if: contains(fromJSON(inputs.gates), 'sast')
      uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
      with:
        name: semgrep-report
        path: ${{ runner.temp }}/security-reports

    - name: Download Gitleaks report
      if: contains(fromJSON(inputs.gates), 'secrets')
      uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
      with:
        name: gitleaks-report
        path: ${{ runner.temp }}/security-reports

    - name: Download Trivy report
      if: contains(fromJSON(inputs.gates), 'sca')
      uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
      with:
        name: trivy-report
        path: ${{ runner.temp }}/security-reports

    - name: Apply SGP Manager gate policies
      uses: kanedasec/platform-workflows/actions/sgp-policy-gate@401956bdb15b5894686b875a6233fabda3f81eb0
      env:
        SGP_MANAGER_API_KEY: ${{ env.SGP_MANAGER_API_KEY }}
      with:
        manager_url: https://sgp.kanedasec.com.br
        application: ${{ github.event.repository.name }}
        gates: ${{ inputs.gates }}
        semgrep_report: ${{ runner.temp }}/security-reports/semgrep.json
        gitleaks_report: ${{ runner.temp }}/security-reports/gitleaks.json
        trivy_report: ${{ runner.temp }}/security-reports/trivy.json
        decision_directory: ${{ runner.temp }}/policy-decisions

    - name: Upload SGP Manager decisions
      if: always()
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
      with:
        name: sgp-policy-decisions
        path: ${{ runner.temp }}/policy-decisions/*.json
        if-no-files-found: warn
        retention-days: 7
